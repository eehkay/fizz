[package]
name = "fizz"
version = "0.1.0"
edition = "2024"
description = "iMessage in your terminal, through a BlueBubbles server"
license = "MIT"
repository = "https://github.com/eehkay/fizz"
readme = "README.md"

[dependencies]
aho-corasick = "1.1.5"
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = "0.4.45"
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "7.0.0"
emojis = "0.9.1"
futures-util = "0.3.34"
image = "0.25.10"
ratatui = "0.30.2"
ratatui-image = { version = "11.1.0", default-features = false, features = ["image-defaults", "crossterm"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "multipart", "query", "rustls", "stream"] }
rust_socketio = { version = "0.6.0", features = ["async"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
textwrap = "0.16.4"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "process"] }
toml = "1.2.1"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.3"

# Builds for release downloads bundle OpenSSL, so the binary runs on any
# Linux without needing a matching system library.
[features]
vendored-tls = ["dep:openssl"]

[target.'cfg(target_os = "linux")'.dependencies]
openssl = { version = "0.10", features = ["vendored"], optional = true }

[profile.release]
opt-level = 3
lto = "thin"
strip = true

# Image decoding is painfully slow unoptimised, even in debug builds.
[profile.dev.package."*"]
opt-level = 2
